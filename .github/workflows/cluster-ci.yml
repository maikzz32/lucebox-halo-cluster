name: Cluster CI (lucebox-halo-cluster)

# Fork-only workflow; upstream's ci.yml is untouched. Two jobs:
#
#   cluster-image  hosted runner, no GPU. Builds Dockerfile.rocm-cluster up to
#                  the `base` stage (toolchain + RDMA + MPI on top of the ROCm
#                  10 SDK) to validate the Dockerfile on every PR. The HIP
#                  build of Lucebox itself is NOT possible on ubuntu-latest
#                  without the SDK + hours of compile, and the GPU-free unit
#                  tests (test_cluster_unit, test_feature_gate) still need the
#                  HIP toolchain to configure, so they run in cluster-smoke.
#   cluster-smoke  OPT-IN, self-hosted runner labelled `halo-cluster` (a
#                  runner on StrixHalo1 with ssh access to strix2). Builds the
#                  cluster targets in a container, runs the GPU-free tests,
#                  launches a 2-node cluster, sends one temperature-0 request
#                  and compares the SHA-256 of the output with the committed
#                  golden. Triggered only by workflow_dispatch because it needs
#                  the vLLM Ray cluster on the nodes to be stopped first.

on:
  pull_request:
    branches: [cluster/main]
    paths:
      - Dockerfile.rocm-cluster
      - docker-bake.hcl
      - scripts/cluster/**
      - server/src/cluster/**
      - server/deps/patches/cluster/**
      - .github/workflows/cluster-ci.yml
  push:
    branches: [cluster/main]
    paths:
      - Dockerfile.rocm-cluster
      - docker-bake.hcl
      - scripts/cluster/**
      - .github/workflows/cluster-ci.yml
  workflow_dispatch:
    inputs:
      run_smoke:
        description: "Run the 2-node smoke on the self-hosted halo-cluster runner (vLLM cluster must be stopped)"
        type: boolean
        default: false
      hosts:
        description: "ssh aliases, head first"
        type: string
        default: "strix1 strix2"
      target_gguf:
        description: "target GGUF name inside /home/maik/gguf/ds4"
        type: string
        default: "DeepSeek-V4-Flash-0731-ROCMFPX-MIX-STRIX.gguf"
      dspark_gguf:
        description: "DSpark drafter GGUF name inside /home/maik/gguf/ds4"
        type: string
        default: "DeepSeek-V4-Flash-0731-DSpark-draft-Q4RMFP4-denseF16.gguf"

concurrency:
  group: cluster-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scripts:
    name: Shell syntax + patch symbols
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: bash -n and shellcheck
        run: |
          set -e
          for f in scripts/cluster/*.sh; do bash -n "$f"; done
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/cluster/*.sh
      - name: ggml patch symbols present
        run: scripts/cluster/check_ggml_patches.sh

  cluster-image:
    name: Dockerfile.rocm-cluster (--target base, no GPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Log in to GHCR (pull the ROCm 10 base image)
        # The default BASE_IMAGE is a public package under the fork owner;
        # login only matters if it is made private later.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build base stage
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile.rocm-cluster
          target: base
          push: false
          load: false
          cache-from: type=gha,scope=rocm-cluster-base
          cache-to: type=gha,scope=rocm-cluster-base,mode=max

  cluster-smoke:
    name: 2-node smoke (self-hosted halo-cluster, opt-in)
    if: github.event_name == 'workflow_dispatch' && inputs.run_smoke
    needs: [scripts]
    runs-on: [self-hosted, halo-cluster]
    timeout-minutes: 90
    env:
      HOSTS: ${{ inputs.hosts }}
      TARGET: ${{ inputs.target_gguf }}
      DSPARK: ${{ inputs.dspark_gguf }}
      IMAGE: ghcr.io/maikzz32/lucebox-halo-cluster:dev
      MODELS_DIR: /home/maik/gguf/ds4
      HEAD_IP: 192.168.100.1
      HTTP_PORT: "8016"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Host prerequisites (check only)
        run: |
          for h in $HOSTS; do echo "== $h"; ssh -o BatchMode=yes "$h" 'bash -s' < scripts/cluster/host_prep.sh; done

      - name: Refuse to run while the vLLM cluster holds the GPUs
        run: |
          for h in $HOSTS; do
            if ssh -o BatchMode=yes "$h" "podman ps --format '{{.Names}}' | grep -qiE 'vllm|ray'"; then
              echo "::error::vLLM/Ray container running on $h; stop it before the smoke (this workflow never kills foreign containers)"; exit 1; fi
          done

      - name: Build cluster targets + GPU-free unit tests in container
        run: |
          set -o pipefail
          head="${HOSTS%% *}"
          JOBS=8 scripts/cluster/build_in_container.sh "$head" --tests-only 2>&1 | tee build-tests.log

      - name: Ensure image present on every node
        run: |
          for h in $HOSTS; do ssh -o BatchMode=yes "$h" "podman image exists $IMAGE" || { echo "::error::$IMAGE missing on $h (make build-rocm-cluster + push/pull)"; exit 1; }; done

      - name: Launch 2-node cluster
        run: |
          scripts/cluster/launch_cluster.sh "$HOSTS" "$TARGET" "$DSPARK" -- --cluster-verify-hash 8
          # wait for the HTTP server (model load takes minutes)
          for i in $(seq 1 120); do
            curl -sf "http://$HEAD_IP:$HTTP_PORT/props" >/dev/null && break
            sleep 5
          done
          curl -sf "http://$HEAD_IP:$HTTP_PORT/props" | jq .cluster

      - name: Temperature-0 request + golden compare
        run: |
          set -o pipefail
          gd=server/tests/cluster-golden
          test -f "$gd/smoke-2node.prompt.json" || { echo "::error::$gd/smoke-2node.prompt.json missing; see $gd/README.md"; exit 1; }
          test -f "$gd/smoke-2node.sha256" || { echo "::error::$gd/smoke-2node.sha256 missing; see $gd/README.md"; exit 1; }
          for run in 1 2 3; do
            curl -sf "http://$HEAD_IP:$HTTP_PORT/v1/chat/completions" -H 'content-type: application/json' \
              -d @"$gd/smoke-2node.prompt.json" | tee "resp-$run.json" | jq -r .choices[0].message.content | sha256sum > "sha-$run.txt"
            echo "run $run: $(cat "sha-$run.txt")"
          done
          expected="$(cat "$gd/smoke-2node.sha256")"
          for run in 1 2 3; do
            if [ "$(cat "sha-$run.txt")" != "$expected" ]; then
              echo "::error::run $run sha256 differs from golden ($expected)"; jq .usage "resp-$run.json" || true; exit 1; fi
          done
          echo "all 3 runs match the golden"
          jq '.usage.timings.cluster' resp-1.json || true

      - name: Collect rank logs
        if: always()
        run: scripts/cluster/launch_cluster.sh --status "$HOSTS" > rank-status.log 2>&1 || true

      - name: Teardown (always)
        if: always()
        run: scripts/cluster/launch_cluster.sh --down "$HOSTS"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: cluster-smoke-logs
          path: |
            build-tests.log
            rank-status.log
            resp-*.json
            sha-*.txt
          if-no-files-found: ignore
